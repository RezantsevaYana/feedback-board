services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # DB_* берутся из корневого .env (docker-compose подставляет их сюда и в контейнер БД),
    # поэтому менять креды нужно только в корне. Остальные настройки Laravel (APP_KEY,
    # SESSION_*) живут в backend/.env, который копируется из .env.example при первом старте.
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "composer install
      && ([ -f .env ] || (cp .env.example .env && php artisan key:generate))
      && php artisan migrate --force && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Board (Vue) + /api proxy to Laravel + widget.js rebuilt on change. http://localhost:5176/demo
  frontend:
    image: node:24
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund
      && (npm run widget:watch -- --logLevel warn &)
      && npm run dev -- --host 0.0.0.0 --port 5176"
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5176:5176"
    volumes:
      - ./frontend:/app
      # Linux node_modules inside the container, separate from the macOS ones on the host
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  # Someone else's site with the widget installed, on another origin: http://localhost:5175
  demo-host:
    image: nginx:1.27-alpine
    ports:
      - "5175:80"
    volumes:
      - ./frontend/demo:/usr/share/nginx/html:ro

  # Catches every letter the backend sends (confirmation, password reset): http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  db-data:
  frontend-node-modules: