<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Роли V1 — проверка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
    <style>
        /* Same tokens as the board (frontend/src/scss/base/_tokens.scss): sage neutrals, one green. */
        :root {
            --bg: #f3f6f4;
            --surface: #ffffff;
            --surface-2: #e8eee9;
            --active: #cfe7d7;
            --active-fg: #063f2c;
            --line: #d8e1db;
            --control: #a9bcb0;
            --fg: #0f2224;
            --muted: #4c5d60;
            --accent: #1d8547;
            --accent-ink: #1b7f41;
            --accent-fg: #ffffff;
            --bug: #b0423a;
            --bug-bg: #f7e4e1;
            --radius: 10px;
            --shadow: 0 10px 28px rgba(16, 37, 40, 0.12);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f2524;
                --surface: #3a4442;
                --surface-2: #2c3433;
                --active: #2f5a43;
                --active-fg: #dff3e6;
                --line: #4a5553;
                --control: #6b7a77;
                --fg: #e8eeea;
                --muted: #a9b6b3;
                --accent: #1d8547;
                --accent-ink: #6fcf96;
                --bug: #efb0a6;
                --bug-bg: #4a2c28;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                color-scheme: dark;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.5 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        a { color: var(--accent-ink); }
        code {
            font: 13px ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            background: var(--surface-2);
            padding: 1px 5px;
            border-radius: 5px;
        }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

        /* top bar: progress, filters, actions — stays while scrolling */
        .bar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .bar-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
        }
        .bar h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .progress {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 220px;
            min-width: 200px;
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            flex: 1;
            height: 8px;
            border-radius: 999px;
            background: var(--surface-2);
            overflow: hidden;
            display: flex;
        }
        .progress-ok { background: var(--accent); transition: width 0.2s ease-out; }
        .progress-bug { background: var(--bug); transition: width 0.2s ease-out; }
        .filters { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
        .filters button {
            border: 1px solid transparent;
            background: none;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
        }
        .filters button[aria-pressed='true'] {
            background: var(--active);
            color: var(--active-fg);
            border-color: var(--accent);
        }
        .btn {
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover { border-color: var(--control); }
        .btn.danger { color: var(--bug); }
        .btn.armed { background: var(--bug); border-color: var(--bug); color: #fff; }

        .layout {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 24px 120px;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 32px;
            align-items: start;
        }

        /* side nav: blocks with their counts */
        .nav {
            position: sticky;
            top: 84px;
            display: grid;
            gap: 2px;
        }
        .nav a {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }
        .nav a:hover { background: var(--surface-2); color: var(--fg); }
        .nav a.done { color: var(--accent-ink); }
        .nav a.has-bug .nav-count { color: var(--bug); font-weight: 600; }
        .nav-count { font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
        .links {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            display: grid;
            gap: 4px;
            font-size: 13px;
        }
        .links a { padding: 3px 10px; }

        .intro { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }

        section.block { margin-bottom: 36px; scroll-margin-top: 90px; }
        section.block h2 {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 600;
        }
        .block-count { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
        .block-note { color: var(--muted); font-size: 14px; margin: 0 0 12px; max-width: 75ch; }
        .block-note p { margin: 0 0 8px; }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 4px 0 16px;
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }
        th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { background: var(--surface-2); font-weight: 600; }
        tr:last-child td { border-bottom: 0; }
        .table-wrap { overflow-x: auto; }

        ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        li.item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 4px 12px;
            align-items: start;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: border-color 0.12s, background-color 0.12s;
        }
        li.item.ok { background: color-mix(in srgb, var(--active) 45%, var(--surface)); }
        li.item.ok .item-text { color: var(--muted); }
        li.item.bug { border-color: var(--bug); background: color-mix(in srgb, var(--bug-bg) 60%, var(--surface)); }
        li.item[hidden] { display: none; }

        .check {
            width: 22px;
            height: 22px;
            margin-top: 1px;
            border-radius: 6px;
            border: 1.5px solid var(--control);
            background: var(--surface);
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
        }
        .check svg { opacity: 0; }
        li.ok .check { background: var(--accent); border-color: var(--accent); color: #fff; }
        li.ok .check svg { opacity: 1; }

        .item-body { min-width: 0; cursor: pointer; }
        .item-id { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-right: 6px; }
        .item-title { font-weight: 600; }
        .item-text { font-size: 14px; }
        .item-text p { margin: 0; }

        .flag {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 8px;
            padding: 3px 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
        }
        .flag:hover { border-color: var(--bug); color: var(--bug); }
        li.bug .flag { background: var(--bug); border-color: var(--bug); color: #fff; }

        .note {
            grid-column: 2 / 4;
            width: 100%;
            min-height: 54px;
            resize: vertical;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--fg);
            font: 14px/1.45 inherit;
            font-family: inherit;
        }
        .note:focus { outline: 2px solid var(--accent-ink); outline-offset: 1px; }

        .empty-filter { color: var(--muted); font-size: 14px; padding: 8px 0; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 8px);
            opacity: 0;
            background: var(--fg);
            color: var(--bg);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: var(--shadow);
            transition: opacity 0.16s ease-out, transform 0.16s ease-out;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 16px 100px; }
            .nav {
                position: static;
                display: flex;
                overflow-x: auto;
                gap: 6px;
                scrollbar-width: none;
            }
            .nav a { border: 1px solid var(--line); white-space: nowrap; flex: none; }
            .links { display: none; }
            .bar-inner { padding: 12px 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<div class="bar">
    <div class="bar-inner">
        <h1>Роли V1 — проверка</h1>
        <div class="progress" aria-live="polite">
            <div class="progress-track" aria-hidden="true"><div class="progress-ok" id="bar-ok"></div><div class="progress-bug" id="bar-bug"></div></div>
            <span id="progress-text"></span>
        </div>
        <div class="filters" role="group" aria-label="Показать">
            <button type="button" data-filter="all" aria-pressed="true">Все</button>
            <button type="button" data-filter="todo" aria-pressed="false">Осталось</button>
            <button type="button" data-filter="bug" aria-pressed="false">Проблемы</button>
        </div>
        <button type="button" class="btn" id="copy-bugs">Скопировать проблемы</button>
        <button type="button" class="btn danger" id="reset">Сбросить</button>
    </div>
</div>

<div class="layout">
    <nav class="nav" id="nav" aria-label="Блоки"></nav>
    <main>
        <p class="intro" id="intro"></p>
        <div id="blocks"></div>
    </main>
</div>

<div class="toast" id="toast" role="status"></div>

const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>'

let state = {}
try { state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {} } catch { state = {} }
let filter = 'all'

function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)) } catch { /* private mode: works until the tab closes */ }
}
function statusOf(id) { return state[id]?.s || '' }
function setStatus(id, s) {
    const cur = state[id] || {}
    cur.s = s
    if (!cur.s && !cur.note) delete state[id]
    else state[id] = cur
    save()
}
function setNote(id, note) {
    const cur = state[id] || {}
    cur.note = note
    if (!cur.s && !cur.note) delete state[id]
    else state[id] = cur
    save()
}

function render() {
    document.getElementById('intro').innerHTML = DATA.intro
    const nav = document.getElementById('nav')
    const blocks = document.getElementById('blocks')
    nav.innerHTML = ''
    blocks.innerHTML = ''

    for (const block of DATA.blocks) {
        const a = document.createElement('a')
        a.href = '#b' + block.num
        a.dataset.block = block.num
        a.innerHTML = `<span>${block.num}. ${block.title}</span><span class="nav-count"></span>`
        nav.appendChild(a)

        const sec = document.createElement('section')
        sec.className = 'block'
        sec.id = 'b' + block.num
        sec.innerHTML = `<h2>${block.num}. ${block.title}<span class="block-count"></span></h2>` +
            (block.note ? `<div class="block-note">${block.note}</div>` : '')
        const ul = document.createElement('ul')
        ul.className = 'items'
        for (const item of block.items) ul.appendChild(renderItem(item))
        sec.appendChild(ul)
        if (block.after) {
            const after = document.createElement('div')
            after.className = 'block-note'
            after.innerHTML = block.after
            sec.appendChild(after)
        }
        const empty = document.createElement('p')
        empty.className = 'empty-filter'
        empty.hidden = true
        sec.appendChild(empty)
        blocks.appendChild(sec)
    }
    const links = document.createElement('div')
    links.className = 'links'
    links.innerHTML = DATA.links
    nav.appendChild(links)
    refresh()
}

function renderItem(item) {
    const li = document.createElement('li')
    li.className = 'item'
    li.dataset.id = item.id
    li.innerHTML = `
        <button type="button" class="check" aria-label="Проверено: ${item.id}">${CHECK_SVG}</button>
        <div class="item-body">
            <div>${item.label ? `<span class="item-id">${item.label}</span>` : ''}${item.title ? `<span class="item-title">${item.title}</span> ` : ''}<span class="item-text">${item.text}</span></div>
        </div>
        <button type="button" class="flag">Проблема</button>`
    const note = document.createElement('textarea')
    note.className = 'note'
    note.placeholder = 'Что не так: шаги, что ждала, что получилось'
    note.value = state[item.id]?.note || ''
    note.hidden = statusOf(item.id) !== 'bug' && !note.value
    note.addEventListener('input', () => { setNote(item.id, note.value); refresh(false) })
    li.appendChild(note)

    const toggleOk = () => { setStatus(item.id, statusOf(item.id) === 'ok' ? '' : 'ok'); refresh() }
    li.querySelector('.check').addEventListener('click', toggleOk)
    // a click on the text checks it too, but not when the click was on a link or a selection
    li.querySelector('.item-body').addEventListener('click', (e) => {
        if (e.target.closest('a') || String(window.getSelection())) return
        toggleOk()
    })
    li.querySelector('.flag').addEventListener('click', () => {
        const isBug = statusOf(item.id) === 'bug'
        setStatus(item.id, isBug ? '' : 'bug')
        note.hidden = isBug && !note.value
        refresh()
        if (!isBug) note.focus()
    })
    return li
}

function refresh() {
    let total = 0, ok = 0, bug = 0
    for (const block of DATA.blocks) {
        let bTotal = 0, bOk = 0, bBug = 0, shown = 0
        for (const item of block.items) {
            const s = statusOf(item.id)
            bTotal++
            if (s === 'ok') bOk++
            if (s === 'bug') bBug++
            const li = document.querySelector(`li.item[data-id="${CSS.escape(item.id)}"]`)
            li.classList.toggle('ok', s === 'ok')
            li.classList.toggle('bug', s === 'bug')
            li.querySelector('.check').setAttribute('aria-pressed', String(s === 'ok'))
            li.querySelector('.flag').setAttribute('aria-pressed', String(s === 'bug'))
            const visible = filter === 'all' || (filter === 'todo' && !s) || (filter === 'bug' && s === 'bug')
            li.hidden = !visible
            if (visible) shown++
        }
        total += bTotal; ok += bOk; bug += bBug
        const sec = document.getElementById('b' + block.num)
        const done = bOk + bBug
        sec.querySelector('.block-count').textContent = `${done} / ${bTotal}`
        const empty = sec.querySelector('.empty-filter')
        empty.hidden = shown > 0
        empty.textContent = filter === 'bug' ? 'Проблем нет.' : 'В этом блоке всё пройдено.'
        const a = document.querySelector(`.nav a[data-block="${block.num}"]`)
        a.querySelector('.nav-count').textContent = bBug ? `${done}/${bTotal} · ${bBug}!` : `${done}/${bTotal}`
        a.classList.toggle('done', bOk === bTotal)
        a.classList.toggle('has-bug', bBug > 0)
    }
    document.getElementById('bar-ok').style.width = (ok / total * 100) + '%'
    document.getElementById('bar-bug').style.width = (bug / total * 100) + '%'
    document.getElementById('progress-text').textContent = `${ok + bug} из ${total}` + (bug ? ` · проблем: ${bug}` : '')
}

document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.filter
    document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
    refresh()
}))

function toast(text) {
    const t = document.getElementById('toast')
    t.textContent = text
    t.classList.add('show')
    clearTimeout(toast.timer)
    toast.timer = setTimeout(() => t.classList.remove('show'), 2200)
}

// «Скопировать проблемы»: markdown in the shape of docs/BUGS.md, ready to paste there
document.getElementById('copy-bugs').addEventListener('click', async () => {
    const lines = []
    for (const block of DATA.blocks) {
        for (const item of block.items) {
            if (statusOf(item.id) !== 'bug') continue
            const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim() }
            lines.push(`- [ ] **${item.label ? item.label + ' ' : ''}${plain(item.title || item.text).replace(/\.$/, '')}**`)
            lines.push(`  Проверка: ${plain(item.text)}`)
            lines.push(`  Что не так: ${(state[item.id]?.note || '—').replace(/\n/g, ' ')}`)
            lines.push('')
        }
    }
    if (!lines.length) { toast('Пока ни одной проблемы'); return }
    const md = '## Ручная проверка ролей (' + new Date().toLocaleDateString('ru-RU') + ')\n\n' + lines.join('\n')
    try {
        await navigator.clipboard.writeText(md)
        toast('Скопировано — вставь в docs/BUGS.md')
    } catch {
        toast('Не вышло скопировать — браузер не дал доступ к буферу')
    }
})

// «Сбросить»: two clicks, the first one arms the button
const reset = document.getElementById('reset')
reset.addEventListener('click', () => {
    if (!reset.classList.contains('armed')) {
        reset.classList.add('armed')
        reset.textContent = 'Точно сбросить всё?'
        setTimeout(() => { reset.classList.remove('armed'); reset.textContent = 'Сбросить' }, 3000)
        return
    }
    state = {}
    save()
    reset.classList.remove('armed')
    reset.textContent = 'Сбросить'
    render()
    toast('Все отметки сброшены')
})

render()
</script>
